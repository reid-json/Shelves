version: 0.2

phases:
  #installing any dependencies
  install:
    commands:
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
      - export PATH=/usr/bin:$PATH
      - node -v
      - npm -v
      - echo "INSTALL complete"
  #running npm run build to get the dist dir
  build:
    commands:
      - ls -la
      - echo "Trying to cd into frontend/app..."
      - cd frontend/app || (echo "Directory not found — dumping tree:" && find . -type d && exit 1)
      - npm install
      - npm run build
      - echo "Build complete — dumping dist:"
      - ls -la dist
  #deploying to S3 and updating any files on S3 that are not on the current build
  post_build:
    commands:
      - echo "Syncing dist to S3..."
      - ls -la dist || echo "dist folder not found"
      - aws s3 sync dist/ s3://my-vue-app-bucket-shelves --delete --exact-timestamps || echo "Sync completed with minor warnings"



artifacts:
  files:
    - '**/*'